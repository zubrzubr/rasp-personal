# https://gethomepage.dev/latest/configs/widgets/
- resources:
    cpu: true
    memory: true
    disk: /

- datetime:
    text_size: xl
    format:
        dateStyle: short
        timeStyle: short
        hour12: false

- openmeteo:
    label: Weather
    latitude: {{HOMEPAGE_VAR_LATITUDE}}
    longitude: {{HOMEPAGE_VAR_LONGITUDE}}
    timezone: Europe/Warsaw
    units: metric
    cache: 5
    format:
      maximumFractionDigits: 1

- search:
    provider: google
    target: _blank
